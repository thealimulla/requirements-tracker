[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "req-tracker"
version = "0.1.0"
description = "One view of product requirements across Slack, Jira, Confluence and Google Sheets"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ali Mulla" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
req-tracker = "req_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
